<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kata Training · Marcos</title>
<style>
:root{
  --bg:#0f1115;--bg2:#171a21;--card:#1d212a;--card2:#252a35;--line:#2e3442;
  --txt:#eef1f6;--mut:#9aa3b2;--dim:#6b7383;
  --acc:#ff6b35;--acc2:#ffb347;--ok:#3ecf8e;--warn:#ffcc4d;--bad:#ff5d6c;--blue:#5aa9ff;
  --r:16px;--safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
a{color:var(--acc2)}
.app{max-width:760px;margin:0 auto;padding:16px 14px calc(96px + var(--safe))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:800;color:#111}
.sub{color:var(--mut);font-size:.85rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mut);font-size:.78rem;white-space:nowrap}
.pill.acc{background:rgba(255,107,53,.15);color:var(--acc2)}
.pill.ok{background:rgba(62,207,142,.15);color:var(--ok)}
.pill.warn{background:rgba(255,204,77,.15);color:var(--warn)}
.pill.blue{background:rgba(90,169,255,.15);color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.hi{background:linear-gradient(160deg,#2a1d17,#1d212a 60%);border-color:#4a2e22}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.grid4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35rem}
.stat span{color:var(--mut);font-size:.75rem}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--card2);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc),#ff8a4c);color:#151515}
.btn.ok{background:var(--ok);color:#0d1f17}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:10px}
.btn.block{width:100%}
.btn.danger{background:rgba(255,93,108,.15);color:var(--bad)}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
label{font-size:.8rem;color:var(--mut);display:block;margin-bottom:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);white-space:nowrap;cursor:pointer;font-size:.88rem}
.tab.on{background:var(--acc);color:#151515;border-color:var(--acc);font-weight:700}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + var(--safe));z-index:40}
nav.bottom .in{display:flex;max-width:760px;width:100%;justify-content:space-around}
nav.bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--dim);padding:6px 8px;cursor:pointer;flex:1}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--acc)}
.view{display:none}.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.exlist .ex{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--card2);margin-bottom:8px;cursor:pointer}
.fig{background:radial-gradient(circle at 50% 40%,#2a3040,#1a1e27);border-radius:12px;flex:none}
.fig svg{display:block;width:100%;height:100%}
.ex .fig{width:64px;height:64px}
.ex .meta{flex:1;min-width:0}
.ex .meta b{display:block}
.muted{color:var(--mut)}.small{font-size:.82rem}.tiny{font-size:.72rem}
.sets{width:100%;border-collapse:collapse;margin-top:8px}
.sets th{font-size:.72rem;color:var(--dim);font-weight:500;text-align:center;padding:4px}
.sets td{padding:3px;text-align:center}
.sets input{text-align:center;padding:8px 4px}
.sets tr.done td{opacity:.65}
.chk{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;display:grid;place-items:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:#0d1f17}
.sug{background:rgba(90,169,255,.1);border:1px dashed rgba(90,169,255,.4);border-radius:10px;padding:8px 10px;font-size:.84rem;margin-top:8px}
.progress{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s}
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + var(--safe));background:#232937;border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:none;align-items:center;gap:12px;z-index:45;box-shadow:0 10px 30px rgba(0,0,0,.5);width:min(92vw,480px)}
.timerbar.on{display:flex}
.timerbar .t{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:74px}
.timerbar .bar{flex:1;height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}
.timerbar .bar i{display:block;height:100%;background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + var(--safe));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .close{float:right}
.bigfig{width:100%;max-width:340px;aspect-ratio:1;margin:0 auto 10px}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin-bottom:5px}
ul.clean{list-style:none;padding:0;margin:6px 0}
ul.clean li{padding:4px 0 4px 22px;position:relative}
ul.clean li:before{content:"";position:absolute;left:4px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
ul.clean.bad li:before{background:var(--bad)}
ul.clean.tip li:before{background:var(--acc2)}
.hr{height:1px;background:var(--line);margin:12px 0}
.check{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--card2);margin-bottom:6px;cursor:pointer}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--dim);flex:none;display:grid;place-items:center}
.check.on .box{background:var(--ok);border-color:var(--ok)}
.check.on .lbl{text-decoration:line-through;color:var(--mut)}
canvas{width:100%;display:block}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heat i{width:100%;aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat i.l1{background:#7a3a20}.heat i.l2{background:var(--acc)}.heat i.today{outline:1.5px solid var(--txt)}
.phase{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:8px 0}
.phase i{height:26px;border-radius:5px;display:grid;place-items:center;font-size:.7rem;font-style:normal;color:#111;font-weight:700}
.phase i.cur{outline:2px solid #fff;outline-offset:1px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120px);background:#262c39;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:80;transition:transform .3s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.daybtn{flex:1;padding:12px 6px;border-radius:14px;background:var(--card2);border:2px solid transparent;cursor:pointer;text-align:center}
.daybtn.on{border-color:var(--acc);background:rgba(255,107,53,.12)}
.daybtn b{display:block;font-size:1.3rem}
.feel{display:flex;gap:6px}
.feel button{flex:1;font-size:1.5rem;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer}
.feel button.on{border-color:var(--acc);background:rgba(255,107,53,.15)}
.table{width:100%;border-collapse:collapse;font-size:.86rem}
.table td,.table th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.table th{color:var(--mut);font-weight:500;font-size:.76rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.emptyst{text-align:center;padding:24px 10px;color:var(--mut)}
.bodymap{width:100%;max-width:230px;display:block;margin:0 auto}
.kbd{font-variant-numeric:tabular-nums}
.q{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--dim);background:transparent;color:var(--mut);font-size:.7rem;font-weight:700;cursor:pointer;padding:0;vertical-align:1px;margin-left:3px}
.wkstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.wkstrip div{background:var(--card2);border-radius:10px;padding:6px 2px;text-align:center;font-size:.7rem;color:var(--mut);border:1.5px solid transparent}
.wkstrip div b{display:block;font-size:1rem;color:var(--txt);margin-top:2px}
.wkstrip div.today{border-color:var(--txt)}
.wkstrip div.done{background:rgba(62,207,142,.16)}
.wkstrip div.rest{opacity:.7}
.wkstrip div.plan b{opacity:.5}
.rest-ok{border-left:4px solid var(--ok)}.rest-rest{border-left:4px solid var(--blue)}.rest-warn{border-left:4px solid var(--warn)}.rest-done{border-left:4px solid var(--acc)}
@media print{
  nav.bottom,.timerbar,.noprint,header.top .btn{display:none!important}
  body{background:#fff;color:#000}
  .card{border:1px solid #bbb;background:#fff;break-inside:avoid}
  .view{display:none!important}.view.printme{display:block!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <h1 id="hello" style="font-size:1.15rem;margin:0">Hola, Marcos</h1>
        <div class="sub" id="phaseLine">Gimnasio Kata · Salamanca</div>
      </div>
    </div>
    <span class="pill acc" id="weekPill">Semana 1</span>
  </header>

  <!-- HOY -->
  <section class="view on" id="v-hoy"></section>
  <!-- PLAN -->
  <section class="view" id="v-plan"></section>
  <!-- EJERCICIOS -->
  <section class="view" id="v-ej"></section>
  <!-- PROGRESO -->
  <section class="view" id="v-prog"></section>
  <!-- MAS -->
  <section class="view" id="v-mas"></section>
</div>

<div class="timerbar" id="timerbar">
  <div>
    <div class="tiny muted">Descanso</div>
    <div class="t" id="tbT">1:30</div>
  </div>
  <div class="bar"><i id="tbBar" style="width:100%"></i></div>
  <button class="btn sm" onclick="Timer.add(15)">+15s</button>
  <button class="btn sm ghost" onclick="Timer.stop()">Saltar</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<nav class="bottom">
  <div class="in">
    <button data-v="hoy" class="on" onclick="go('hoy')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6M6 5v14M18 5v14"/></svg>Hoy</button>
    <button data-v="plan" onclick="go('plan')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
    <button data-v="ej" onclick="go('ej')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="4.5" r="2"/><path d="M12 7v7M7 10l5-2 5 2M9 21l3-7 3 7"/></svg>Ejercicios</button>
    <button data-v="prog" onclick="go('prog')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progreso</button>
    <button data-v="mas" onclick="go('mas')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</button>
  </div>
</nav>

<script>
/* =========================================================
   DATOS: GIMNASIO KATA (fuente: gimnasiokata.com, nov-2026)
   ========================================================= */
const GYM = {
  name:'Gimnasio Kata', addr:'Paseo de Carmelitas 79-81, Salamanca', tel:'923 266 388',
  hours:'L-V 6:30–23:00 · S-D 9:00–21:00', monitors:'Monitores en sala de 6:30 a 23:00 (laborables)',
  zones:[
    {z:'Cardio Matrix',items:'Cintas de correr, bicicletas estáticas, elípticas y remos',st:'ok'},
    {z:'Peso libre',items:'Mancuernas de 1 a 40 kg, barras olímpicas, discos y racks de sentadillas',st:'ok'},
    {z:'Fuerza guiada Matrix',items:'Máquinas de pecho, espalda, hombros, piernas y brazos',st:'ok'},
    {z:'Cables / poleas',items:'Se mencionan "cables". Modelo y número sin detallar',st:'check'},
    {z:'Bancos, prensa, curl femoral, extensión cuádriceps',items:'Habituales en una sala Matrix de piernas, pero la web no los lista uno a uno',st:'check'},
    {z:'Zona funcional',items:'TRX, battle ropes, kettlebells, cajas de pliometría',st:'ok'},
    {z:'Estiramientos',items:'Colchonetas, foam rollers, bandas elásticas',st:'ok'},
  ]
};

/* =========================================================
   POSES (vista lateral, mirando a la derecha). Suelo y=180
   Puntos: h cabeza · n cuello/hombro · e codo · w mano · p cadera · k rodilla · a tobillo
   Opcionales: e2/w2 segundo brazo · k2/a2 segunda pierna · s/s2 hombros (vista frontal)
   ========================================================= */
function P(str){const o={};str.trim().split(/\s+/).forEach(t=>{const m=t.match(/^(e2|w2|k2|a2|s2|h|n|e|w|p|k|a|s)(-?[\d.]+),(-?[\d.]+)$/);if(m)o[m[1]]=[+m[2],+m[3]];});return o;}
const STAND='h100,28 n100,46 e100,72 w102,96 p100,104 k101,141 a100,178';
function pose(a,b){const A=P(a),B=Object.assign({},A,P(b));return{a:A,b:B};}

/* =========================================================
   BIBLIOTECA DE EJERCICIOS
   st: ok = equipamiento confirmado en la web del Kata · check = habitual, confirmar en sala
   unit: kg (total) | kgdb (kg por mancuerna) | reps (peso corporal) | s (segundos)
   ========================================================= */
const EX = {
 goblet:{n:'Sentadilla goblet',eq:'Mancuerna',zone:'Peso libre',st:'ok',unit:'kgdb',inc:2,
   m1:['cuadriceps','gluteos'],m2:['abdomen','lumbares'],
   steps:['Coge una mancuerna en vertical y sujétala pegada al pecho, con los codos hacia abajo.','Pies a la anchura de los hombros, puntas un poco hacia fuera.','Baja como si te sentaras en una silla. Rodillas en la dirección de los pies.','Llega hasta que el muslo quede paralelo al suelo o un poco más abajo, con la espalda recta.','Sube empujando el suelo con todo el pie y soltando el aire.'],
   cues:['Pecho orgulloso, mirada al frente','Los codos rozan el interior de las rodillas abajo','Peso repartido: talón y planta'],
   errs:['Talones que se levantan','Rodillas que se cierran hacia dentro','Espalda redondeada abajo'],
   next:'sq_bar',nextTxt:'Cuando hagas 3×12 con 24-28 kg y técnica perfecta, pide a un monitor que te enseñe la sentadilla con barra en el rack.',
   alt:['leg_press','lunge'],pose:pose('h100,28 n100,46 e110,66 w106,54 p100,104 k102,141 a100,178','h103,66 n100,84 e112,104 w108,92 p84,138 k114,137 a102,178'),props:[{t:'db',at:'w'}]},
 sq_bar:{n:'Sentadilla con barra (rack)',eq:'Barra olímpica + rack',zone:'Peso libre',st:'ok',unit:'kg',inc:2.5,
   m1:['cuadriceps','gluteos'],m2:['lumbares','abdomen','femorales'],
   steps:['Pon la barra en el rack a la altura de la mitad del pecho y los seguros justo por debajo de tu sentadilla.','Mete los hombros bajo la barra y apóyala sobre los trapecios, no sobre el cuello.','Sácala con dos pasos atrás y coloca los pies a la anchura de los hombros.','Coge aire, aprieta el abdomen y baja controlando hasta el paralelo.','Sube manteniendo el pecho alto.'],
   cues:['Aire dentro y abdomen duro en cada repetición','Los seguros del rack siempre puestos','Empieza con la barra sola (20 kg)'],
   errs:['Rebotar abajo','La cadera sube antes que el pecho','Sin seguros o sin compañero'],
   alt:['goblet','leg_press'],pose:pose('h100,28 n100,46 e88,58 w95,46 p100,104 k102,141 a100,178','h108,68 n104,86 e92,98 w99,86 p82,136 k114,136 a102,178'),props:[{t:'rack'},{t:'bar',at:'w'}]},
 db_bench:{n:'Press de banca con mancuernas',eq:'Banco plano + mancuernas',zone:'Peso libre',st:'check',unit:'kgdb',inc:2,
   m1:['pecho'],m2:['triceps','hombros'],
   steps:['Siéntate con las mancuernas sobre los muslos y túmbate llevándolas al pecho.','Pies firmes en el suelo, omóplatos juntos y hacia abajo.','Empuja hacia arriba hasta casi estirar los brazos, con las mancuernas casi tocándose.','Baja despacio (2-3 s) hasta que los codos queden un poco por debajo del banco.','Los codos van a unos 45° del cuerpo, no en cruz.'],
   cues:['Omóplatos "metidos en los bolsillos de atrás"','Muñecas rectas, encima de los codos','Suelta el aire al subir'],
   errs:['Codos abiertos a 90°','Arquear muchísimo la espalda o levantar el culo','Dejar caer el peso'],
   alt:['chest_m','pushup'],pose:pose('h42,128 n58,134 e62,108 w62,84 p115,134 k145,124 a150,178','e74,150 w64,124'),props:[{t:'bench'},{t:'db',at:'w'}]},
 lat_pd:{n:'Jalón al pecho',eq:'Máquina de espalda / polea alta',zone:'Fuerza guiada',st:'check',unit:'kg',inc:5,
   m1:['dorsales'],m2:['biceps','trapecio'],
   steps:['Ajusta el rodillo para que te sujete bien los muslos.','Coge la barra un poco más ancha que los hombros.','Inclínate un pelín hacia atrás, pecho hacia el techo.','Tira de la barra hacia la parte alta del pecho llevando los codos hacia abajo y atrás.','Sube controlando hasta estirar los brazos del todo.'],
   cues:['Piensa en "meter los codos en los bolsillos"','Hombros lejos de las orejas','Pausa de 1 s abajo'],
   errs:['Tirar con impulso balanceándote','Bajar la barra por detrás de la nuca','Encoger los hombros'],
   alt:['trx_row','db_row'],pose:pose('h98,62 n98,80 e104,55 w108,32 p96,130 k130,128 a132,176','e90,104 w104,88'),props:[{t:'seat'},{t:'cable',from:[108,-14],at:'w'},{t:'hbar',at:'w'}]},
 rdl:{n:'Peso muerto rumano con mancuernas',eq:'Mancuernas',zone:'Peso libre',st:'ok',unit:'kgdb',inc:2,
   m1:['femorales','gluteos'],m2:['lumbares','trapecio'],
   steps:['De pie, una mancuerna en cada mano delante de los muslos y rodillas ligeramente flexionadas.','Echa la cadera hacia atrás, como si quisieras cerrar una puerta con el culo.','Las mancuernas bajan pegadas a las piernas y la espalda se mantiene recta.','Para cuando notes tensión fuerte detrás de los muslos, normalmente a media tibia.','Sube empujando la cadera hacia delante y aprieta glúteos arriba.'],
   cues:['Es una bisagra de cadera, no una sentadilla','Espalda neutra siempre','Las rodillas casi no se mueven'],

function phaseOf(week){

    txt:'Aprende la técnica. Termina cada serie con 3-4 repeticiones en reserva. Aquí no importa el peso, importa hacerlo bien.'};
  else if(w<=8) p={k:'hy',name:'Hipertrofia',color:'#ff6b35',main:{sets:3,reps:[8,12]},acc:{sets:3,reps:null},core:{sets:3,reps:[30,50]},rpe:'7-8',rest:90,
    txt:'Construye músculo. Sube peso cuando llegues arriba del rango en todas las series. Deja 2-3 repeticiones en reserva.'};
  else if(w<=11) p={k:'fu',name:'Fuerza base',color:'#ffb347',main:{sets:4,reps:[6,8]},acc:{sets:3,reps:null},core:{sets:3,reps:[40,60]},rpe:'7-8',rest:120,
    txt:'Más peso y menos repeticiones en los ejercicios principales. Descanso de 2 min. La técnica sigue mandando.'};
  else p={k:'de',name:'Descarga',color:'#3ecf8e',main:{sets:2,reps:[8,10]},acc:{sets:2,reps:null},core:{sets:2,reps:[20,40]},rpe:'5-6',rest:90,
    txt:'Semana suave: un 20 % menos de peso y menos series. El cuerpo se recupera y vuelves más fuerte al siguiente ciclo.'};
  p.w=w;p.cycle=cycle;return p;
}
function prescription(item,ph){

  start(sec){this.total=sec;this.end=Date.now()+sec*1000;document.getElementById('timerbar').classList.add('on');clearInterval(this.iv);this.iv=setInterval(()=>this.tick(),250);this.tick();},
  add(s){this.end+=s*1000;this.total+=s;this.tick();},
  stop(){clearInterval(this.iv);document.getElementById('timerbar').classList.remove('on');},
  tick(){const left=Math.max(0,Math.round((this.end-Date.now())/1000));document.getElementById('tbT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');document.getElementById('tbBar').style.width=(left/this.total*100)+'%';
    if(left<=0){this.stop();beep();if(S.profile.vibrate&&navigator.vibrate)navigator.vibrate([200,100,200]);toast('⏱️ ¡A por la siguiente serie!');}}
};
let AC;function beep(){if(!S.profile.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i===2?1046:784;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.2);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.22);});}catch(e){}}

function queueSummary(s){

let flushing=false;
async function flushOutbox(){
  if(flushing||!S.outbox||!S.outbox.length||!navigator.onLine)return;flushing=true;
  try{while(S.outbox.length){await fetch(WEBHOOK,{method:'POST',mode:'no-cors',body:JSON.stringify(S.outbox[0])});S.outbox.shift();save();toast('📧 Resumen enviado a tu email');}}

function sessionVolume(s){let v=0;for(const id in s.entries){const ex=EX[id];if(!ex||!(ex.unit==='kg'||ex.unit==='kgdb'))continue;s.entries[id].forEach(x=>v+=(x.w||0)*(x.r||0)*(ex.unit==='kgdb'&&!['tri_ext','goblet'].includes(id)?2:1));}return Math.round(v);}
function weekStreak(){

    const ks=Object.keys(wv).map(Number).sort((a,b)=>a-b);
    barChart(document.getElementById('pc2'),ks.map(k=>({x:'S'+k,y:wv[k],c:phaseOf(k).color})));
    const ss=[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date));
    lineChart(document.getElementById('pc3'),ss.map(s=>({x:s.date.slice(5),y:s.feel||0})),{color:'#3ecf8e',second:ss.map(s=>({x:'',y:(s.dur||0)/20})),secondColor:'#ffb347',min:0,max:5,dec:0});
  },30);
}
function adherence(){const cur=weekNum();let need=0,got=0;for(let w=Math.max(1,cur-7);w<=cur;w++){const c=S.sessions.filter(s=>weekNum(s.date)===w).length;if(w===cur&&c<3)continue;need+=3;got+=Math.min(3,c);}return need?Math.round(got/need*100):100;}
function heatmap(){
  const days=new Set(S.sessions.map(s=>s.date)),t=new Date();t.setHours(0,0,0,0);
  const start=new Date(t);start.setDate(start.getDate()-((start.getDay()+6)%7)-15*7);
  let s='<div class="heat" style="margin-top:8px">';
  for(let i=0;i<16*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const fut=d>t;s+=`<i class="${days.has(k)?'l2':''} ${+d===+t?'today':''}" style="${fut?'opacity:.25':''}" title="${k}"></i>`;}
  return s+'</div><div class="row between tiny muted" style="margin-top:4px"><span>hace 16 sem.</span><span>hoy</span></div>';
}

/* =========================================================
   GRÁFICAS (canvas)
   ========================================================= */
function setupCanvas(c){const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=+c.getAttribute('height');c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';const g=c.getContext('2d');g.scale(dpr,dpr);return{g,w,h};}
function lineChart(c,pts,o={}){
  if(!c)return;const{g,w,h}=setupCanvas(c);const pad={l:34,r:10,t:10,b:20};
  if(!pts.length){g.fillStyle='#6b7383';g.font='12px sans-serif';g.fillText('Sin datos aún',w/2-36,h/2);return;}
  const all=pts.map(p=>p.y).concat(o.second?o.second.map(p=>p.y):[]);
  let mn=o.min??Math.min(...all),mx=o.max??Math.max(...all);if(mn===mx){mn-=1;mx+=1;}const sp=mx-mn;if(o.min===undefined){mn-=sp*.1;}if(o.max===undefined)mx+=sp*.1;
  const X=i=>pad.l+(pts.length===1?(w-pad.l-pad.r)/2:i*(w-pad.l-pad.r)/(pts.length-1)),Y=v=>pad.t+(1-(v-mn)/(mx-mn))*(h-pad.t-pad.b);
  g.strokeStyle='#2e3442';g.fillStyle='#6b7383';g.font='10px sans-serif';g.lineWidth=1;
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g.beginPath();g.moveTo(pad.l,y);g.lineTo(w-pad.r,y);g.stroke();g.fillText(v.toFixed(o.dec??0),2,y+3);}
  const step=Math.ceil(pts.length/6);pts.forEach((p,i)=>{if(i%step===0&&p.x)g.fillText(p.x,X(i)-12,h-4);});
  const draw=(arr,col,fill)=>{g.strokeStyle=col;g.lineWidth=2.5;g.lineJoin='round';g.beginPath();arr.forEach((p,i)=>i?g.lineTo(X(i),Y(p.y)):g.moveTo(X(i),Y(p.y)));g.stroke();
    if(fill&&arr.length>1){const gr=g.createLinearGradient(0,pad.t,0,h);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.lineTo(X(arr.length-1),h-pad.b);g.lineTo(X(0),h-pad.b);g.closePath();g.fill();}
    g.fillStyle=col;arr.forEach((p,i)=>{g.beginPath();g.arc(X(i),Y(p.y),3,0,7);g.fill();});};
  if(o.second)draw(o.second,o.secondColor||'#5aa9ff',false);
  draw(pts,o.color||'#ff6b35',true);
}
function barChart(c,pts){
  if(!c)return;const{g,w,h}=setupCanvas(c);const pad={l:40,r:6,t:10,b:20};if(!pts.length)return;
  const mx=Math.max(...pts.map(p=>p.y))*1.1||1,bw=(w-pad.l-pad.r)/pts.length;
  g.font='10px sans-serif';g.fillStyle='#6b7383';g.strokeStyle='#2e3442';
  for(let i=0;i<=3;i++){const v=mx*i/3,y=pad.t+(1-i/3)*(h-pad.t-pad.b);g.beginPath();g.moveTo(pad.l,y);g.lineTo(w-pad.r,y);g.stroke();g.fillText(v>=1000?(v/1000).toFixed(1)+'k':Math.round(v),2,y+3);}
  pts.forEach((p,i)=>{const bh=p.y/mx*(h-pad.t-pad.b),x=pad.l+i*bw+bw*.15;g.fillStyle=p.c||'#ff6b35';g.beginPath();g.roundRect?g.roundRect(x,h-pad.b-bh,bw*.7,bh,4):g.rect(x,h-pad.b-bh,bw*.7,bh);g.fill();g.fillStyle='#6b7383';if(pts.length<=16||i%2===0)g.fillText(p.x,x,h-5);});
}

  const seq=['A','B','C'];let n=0;
  for(let w=0;w<3;w++)[0,2,5].forEach((dd,i)=>{const date=addDays(st,w*7+dd),day=seq[i],D=DAYS[day],e={};
    D.ex.forEach(it=>{const ex=EX[it.id],b=base[it.id],inc=n*0.35;e[it.id]=Array.from({length:w<2?2:3},(_,k)=>({w:ex.unit.startsWith('kg')?round(b+inc*ex.inc,ex.inc):0,r:ex.unit==='s'?Math.round(b+n*2):ex.unit==='reps'?8+Math.min(6,n):10+Math.min(2,w)-(k>1?1:0),rpe:7,done:true}));});
    S.sessions.push({id:Date.now()+n,loc:'gym',date,day,dur:85+Math.round(Math.random()*10),entries:e,cardio:'',feel:3+(n%3===0?1:0),notes:'',prs:[],week:w+1});n++;});
  S.tests.push({date:st,push:12,plank:45,sq60:38,row500:125,jump:190});S.measures.push({date:st,peso:58,alt:172,brazo:28,pecho:86,muslo:48,cint:72});
  save();render();toast('Datos de ejemplo cargados');
}

/* INIT */
S.weekGoals=S.weekGoals||{};S.outbox=S.outbox||[];if(S.profile.emailOn===undefined)S.profile.emailOn=true;if(!S.profile.wkLoc)S.profile.wkLoc='gym';
render();
setTimeout(flushOutbox,1500);
if(S.active)toast('Tienes una sesión en curso. ¡Sigue!');
window.addEventListener('resize',()=>{if(CUR==='prog')rProg();});
</script>
